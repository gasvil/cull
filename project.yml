name: Cull
options:
  bundleIdPrefix: com.gabrielsanchez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "complete"

targets:
  Cull:
    type: application
    platform: iOS
    sources:
      - path: Cull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielsanchez.cull
        INFOPLIST_FILE: Cull/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic

  CullTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CullTests
    dependencies:
      - target: Cull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielsanchez.cullTests
